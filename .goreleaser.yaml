version: 2

project_name: tronctl

builds:
  - main: ./cmd/tronctl
    binary: tronctl
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version=v{{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.builtAt={{ .Date }}
      - -X main.builtBy=goreleaser@gotron.sh
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt
  # The tronctl-pq_* archives (FN-DSA-512 builds from
  # .github/workflows/tronctl-pq.yaml) are listed in checksums.txt too.
  # release.yaml downloads them to dist-pq/ (gitignored, so the tree stays
  # clean) and fails unless all of them are there. The glob must be relative:
  # GoReleaser rejects absolute paths. A missing or empty dist-pq/ matches
  # nothing without an error, which keeps local snapshots working.
  extra_files:
    - glob: dist-pq/tronctl-pq_*

changelog:
  sort: desc
  # Entries are `<abbrev-sha> <subject>` (git log --pretty=oneline --abbrev-commit).
  # Every pattern anchors on the hash prefix itself (^[[:xdigit:]]+\s+) rather than
  # a bare `^.*?type` — the loose form also matches "type:" appearing later in the
  # subject text (e.g. a chore commit whose message happens to mention "feat:"),
  # misgrouping or wrongly excluding it.
  # Titles match the release-note headings documented in CLAUDE.md, so the
  # generated changelog needs no manual reformatting before publishing.
  groups:
    - title: ✨ Features
      regexp: '^[[:xdigit:]]+\s+feat(\(.+\))??!?:.+$'
      order: 0
    - title: 🔒 Security
      regexp: '^[[:xdigit:]]+\s+(sec|security)(\(.+\))??!?:.+$'
      order: 1
    - title: 🐛 Bug Fixes
      regexp: '^[[:xdigit:]]+\s+fix(\(.+\))??!?:.+$'
      order: 2
    - title: 🔨 Refactoring
      regexp: '^[[:xdigit:]]+\s+refactor(\(.+\))??!?:.+$'
      order: 3
    - title: ⚡ Performance
      regexp: '^[[:xdigit:]]+\s+perf(\(.+\))??!?:.+$'
      order: 4
    - title: Other
      order: 999
  filters:
    exclude:
      - '^[[:xdigit:]]+\s+docs(\(.+\))??!?:.+$'
      - '^[[:xdigit:]]+\s+test(\(.+\))??!?:.+$'
      - '^[[:xdigit:]]+\s+chore(\(.+\))??!?:.+$'
      - '^[[:xdigit:]]+\s+ci(\(.+\))??!?:.+$'
      - '^[[:xdigit:]]+\s+Merge '

brews:
  - repository:
      owner: fbsobreira
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: tronctl
    homepage: https://gotron.sh
    description: Go SDK & CLI for TRON blockchain
    license: LGPL-3.0-or-later
    install: |
      bin.install "tronctl"
    test: |
      system "#{bin}/tronctl", "version"

release:
  prerelease: auto
  # Attach the tronctl-pq_* archives to the same release (see checksum above).
  extra_files:
    - glob: dist-pq/tronctl-pq_*
  footer: |
    ### Which archive signs FN-DSA-512?

    Only the `tronctl-pq_*` archives can create FN-DSA-512 (Falcon-512) keys and sign with them. They are built with `-tags falcon` and a statically linked [liboqs](https://openquantumsafe.org/liboqs/), for linux/amd64, linux/arm64, darwin/amd64, darwin/arm64 and windows/amd64; there is no windows/arm64 build.

    The `tronctl_*` archives and the Homebrew formula are built without CGO: they handle ML-DSA-44 fully and can import, list and export FN-DSA-512 keys, but cannot create FN-DSA-512 keys or sign with them.

    Every archive is listed in `checksums.txt`. TIP-899 is experimental and live only on the Nile testnet; see [docs/post-quantum.md](https://github.com/fbsobreira/gotron-sdk/blob/master/docs/post-quantum.md#tronctl-builds-with-fn-dsa-512).
