version: 2

project_name: tronctl

builds:
  - main: ./cmd/tronctl
    binary: tronctl
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version=v{{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.builtAt={{ .Date }}
      - -X main.builtBy=goreleaser@gotron.sh
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: desc
  # Entries are `<abbrev-sha> <subject>` (git log --pretty=oneline --abbrev-commit),
  # so every pattern must tolerate the leading hash — a bare `^feat` never matches.
  # Titles match the release-note headings documented in CLAUDE.md, so the
  # generated changelog needs no manual reformatting before publishing.
  groups:
    - title: ✨ Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: 🔒 Security
      regexp: '^.*?(sec|security)(\(.+\))??!?:.+$'
      order: 1
    - title: 🐛 Bug Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 2
    - title: 🔨 Refactoring
      regexp: '^.*?refactor(\(.+\))??!?:.+$'
      order: 3
    - title: ⚡ Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 4
    - title: Other
      order: 999
  filters:
    exclude:
      - '^.*?docs(\(.+\))??!?:.+$'
      - '^.*?test(\(.+\))??!?:.+$'
      - '^.*?chore(\(.+\))??!?:.+$'
      - '^.*?ci(\(.+\))??!?:.+$'
      - '^.*?Merge '

brews:
  - repository:
      owner: fbsobreira
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: tronctl
    homepage: https://gotron.sh
    description: Go SDK & CLI for TRON blockchain
    license: LGPL-3.0-or-later
    install: |
      bin.install "tronctl"
    test: |
      system "#{bin}/tronctl", "version"

release:
  prerelease: auto
